name: SDE Frontend CI
# -------------------------------------------------------------------
# Pull request:
#   - Dependency scan
#   - CodeQL
#   - Secret scan
#   - No Docker image push
#   - No Helm deployment
#
# Push to main/develop/release:
#   - Run CI checks
#   - Build and push frontend image
#   - Run existing Trivy workflow
#   - No automatic deployment
#
# Push to feature/**, bugfix/**, hotfix/**, chore/**, docs/**:
#   - Run CI checks
#   - Build and push frontend image
#   - Run existing Trivy workflow
#   - Trigger Helm repository for developer preview
#
# Docker tag examples:
#   feature/new-ui -> feature-new-ui
#   bugfix/login   -> bugfix-login
#   develop        -> develop
#
# The existing dockerbuild.yml is reused without modification.
# -------------------------------------------------------------------

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "chore/**"
      - "docs/**"
      - "release/**"
      - ci-cd-branch

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read
  security-events: write
  id-token: write
  issues: write

concurrency:
  group: sde-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: harbor-hub-shared.arena.3ascloud.de/arena2036/managed-simple-data-exchanger-frontend

jobs:
#   # Existing dependency workflow.
#   # dependencies.yml must support workflow_call.
#   dependencies:
#     name: Check Dependencies
#     uses: ./.github/workflows/dependencies.yml
#     secrets: inherit

#   # Existing CodeQL workflow.
#   # code-ql.yml must support workflow_call.
#   codeql:
#     name: CodeQL
#     uses: ./.github/workflows/code-ql.yml
#     secrets: inherit

#   # Existing TruffleHog workflow.
#   # Check the exact capitalization of the filename.
#   secret-scan:
#     name: Secret Scan
#     uses: ./.github/workflows/truffleHog.yml
#     secrets: inherit

  # KICS is currently disabled.
  # Enable it after kics.yml supports workflow_call.
  # kics:
  #   name: KICS
  #   uses: ./.github/workflows/kics.yml
  #   secrets: inherit

  # Resolve the branch-based image tag generated by docker metadata.
  #
  # Examples:
  #   feature/new-ui -> feature-new-ui
  #   bugfix/login   -> bugfix-login
  #   ci-cd-branch   -> ci-cd-branch
  resolve-image-tag:
    name: Resolve Image Tag
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}

    steps:
      - name: Resolve image tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          else
            IMAGE_TAG="$(printf '%s' "${{ github.ref_name }}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's#[^a-z0-9._-]#-#g' \
              | sed 's/--*/-/g' \
              | sed 's/^-//' \
              | sed 's/-$//' \
              | cut -c1-100)"
          fi

          if [[ -z "$IMAGE_TAG" ]]; then
            echo "Unable to resolve frontend image tag"
            exit 1
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Frontend image tag: $IMAGE_TAG"

      - name: Write image summary
        shell: bash
        run: |
          {
            echo "## Frontend image"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Image tag | \`${{ steps.resolve.outputs.image_tag }}\` |"
            echo "| Repository | \`${IMAGE_REPOSITORY}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Existing Docker workflow.
  # The current dockerbuild.yml generates:
  #   - branch tag
  #   - Git SHA tag
  #   - latest tag
  docker:
    name: Build Frontend Image

    needs:
    #   - dependencies
    #   - codeql
    #   - secret-scan
      - resolve-image-tag

    # Pull requests already run directly in the existing dockerbuild.yml.
    # The orchestrator does not invoke another Docker build for PRs.
    if: github.event_name != 'pull_request'

    uses: ./.github/workflows/dockerbuild.yml
    secrets: inherit

  # Verify that the branch-tagged image was pushed to Harbor.
  verify-image:
    name: Verify Frontend Image

    needs:
      - resolve-image-tag
      - docker

    runs-on: ubuntu-latest

    steps:
      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y skopeo

          skopeo --version

      - name: Verify frontend image
        env:
          HBR_USERNAME: ${{ secrets.HBR_USERNAME }}
          HBR_PASSWORD: ${{ secrets.HBR_PASSWORD }}
          IMAGE_TAG: ${{ needs.resolve-image-tag.outputs.image_tag }}

        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_REPOSITORY}:${IMAGE_TAG}"

          if [[ -z "$HBR_USERNAME" || -z "$HBR_PASSWORD" ]]; then
            echo "Harbor credentials are missing"
            exit 1
          fi

          echo "Checking frontend image:"
          echo "$IMAGE"

          if ! skopeo inspect \
            --creds "${HBR_USERNAME}:${HBR_PASSWORD}" \
            "docker://${IMAGE}" \
            > /tmp/frontend-image.json \
            2> /tmp/frontend-image-error.log; then

            echo "Frontend image does not exist or cannot be accessed"
            cat /tmp/frontend-image-error.log || true
            exit 1
          fi

          echo "Frontend image exists in Harbor"

  # Existing reusable Trivy workflow.
  trivy:
    name: Trivy Image Scan

    needs:
      - resolve-image-tag
      - verify-image

    uses: ./.github/workflows/reusable-trivy.yml

    with:
      image_tag: ${{ needs.resolve-image-tag.outputs.image_tag }}

    secrets: inherit

  # -----------------------------------------------------------------
  # Trigger the Helm repository only for preview branches.
  #
  # The backend repository triggers the same Helm workflow.
  # The Helm workflow waits until both frontend and backend images
  # exist before deploying the preview.
  # -----------------------------------------------------------------
  trigger-helm:
    name: Trigger Helm Preview

    needs:
      - resolve-image-tag
      - trivy

    if: |
      github.event_name == 'push' &&
      (
        github.ref_name == 'ci-cd-branch' ||
        startsWith(github.ref_name, 'feature/') ||
        startsWith(github.ref_name, 'bugfix/') ||
        startsWith(github.ref_name, 'hotfix/') ||
        startsWith(github.ref_name, 'chore/') ||
        startsWith(github.ref_name, 'docs/')
      )

    runs-on: ubuntu-latest

    steps:
      - name: Validate Helm repository token
        env:
          GH_TOKEN: ${{ secrets.HELM_REPO_PAT }}

        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "HELM_REPO_PAT is missing"
            echo "Create the secret in the frontend repository."
            exit 1
          fi

          echo "Helm repository token is configured"

      - name: Trigger Helm repository
        env:
            GH_TOKEN: ${{ secrets.HELM_REPO_PAT }}
            IMAGE_TAG: ${{ needs.resolve-image-tag.outputs.image_tag }}

        shell: bash
        run: |
            set -euo pipefail

            gh api \
            --method POST \
            "/repos/ARENA2036/managed-simple-data-exchanger/dispatches" \
            --input - <<EOF
            {
            "event_type": "sde-deployment-request",
            "client_payload": {
                "source": "frontend",
                "branch": "${{ github.ref_name }}",
                "image_tag": "${IMAGE_TAG}"
            }
            }
            EOF

            echo "Helm repository was triggered"
            echo "Source: frontend"
            echo "Branch: ${{ github.ref_name }}"
            echo "Image tag: $IMAGE_TAG"

      - name: Write trigger summary
        shell: bash
        run: |
          {
            echo "## Helm preview trigger"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Source | \`frontend\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Image tag | \`${{ needs.resolve-image-tag.outputs.image_tag }}\` |"
            echo "| Helm repository | \`ARENA2036/managed-simple-data-exchanger\` |"
          } >> "$GITHUB_STEP_SUMMARY"